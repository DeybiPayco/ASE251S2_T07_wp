<header class="header">
  <div class="container">
    <div class="header-inner">
      <div class="brand">
        <span class="logo"></span>
        <h1>Pastelería Delicias</h1>
      </div>

      <nav class="nav">
        <a href="{{ url_for('index') }}">Inicio</a>
        <div class="dropdown">
          <a href="{{ url_for('productos') }}">Productos</a>
          <div class="dropdown-content">
            <a href="#">Pasteles</a>
            <a href="#">Galletas</a>
            <a href="#">Bebidas</a>
          </div>
        </div>
        <a href="{{ url_for('contactanos') }}">Contacto</a>
      </nav>

      <div class="flex items-center gap-4">
        {% if current_user.is_authenticated %}
          <div class="user-menu">
            <div class="dropdown">
              <button class="btn btn-user">
                <span class="user-avatar">{{ current_user.nombre[0].upper() if current_user.nombre else 'U' }}</span>
                {{ current_user.nombre }}
              </button>
              <div class="dropdown-content">
                <a href="{{ url_for('perfil') }}">Mi Perfil</a>
                {% if current_user.es_admin %}
                  <a href="{{ url_for('admin_dashboard') }}">
                    <i class="fas fa-cog"></i>
                    Panel Admin
                  </a>
                {% endif %}
                <hr class="dropdown-divider">
                <a href="{{ url_for('logout') }}">Cerrar Sesión</a>
              </div>
            </div>
          </div>
        {% else %}
          <div style="display: flex; gap: 1rem; align-items: center;">
            <a href="{{ url_for('login') }}"
               onclick="console.log('Login clicked'); window.location.href='{{ url_for('login') }}'; return false;"
               style="display: inline-block; padding: 0.5rem 1rem; border: 1px solid #d1d5db; border-radius: 0.375rem; text-decoration: none; color: #374151; background-color: transparent; font-size: 0.875rem; font-weight: 500; cursor: pointer; z-index: 1000; position: relative;">
              Iniciar Sesión
            </a>
            <a href="{{ url_for('register') }}"
               onclick="console.log('Register clicked'); window.location.href='{{ url_for('register') }}'; return false;"
               style="display: inline-block; padding: 0.5rem 1rem; border: 1px solid #3b82f6; border-radius: 0.375rem; text-decoration: none; color: white; background-color: #3b82f6; font-size: 0.875rem; font-weight: 500; cursor: pointer; z-index: 1000; position: relative;">
              Registrarse
            </a>
          </div>
        {% endif %}

        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
          <img src="{{ url_for('static', filename='image/moon-icon.svg') }}" alt="Modo oscuro" class="moon-icon">
          <img src="{{ url_for('static', filename='image/sun-icon.svg') }}" alt="Modo claro" class="sun-icon hidden">
        </button>
      </div>
    </div>
  </div>
</header>

<style>
.user-menu .btn-user {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: transparent;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  cursor: pointer;
  transition: all 0.15s;
}

.user-menu .btn-user:hover {
  background: #f3f4f6;
  border-color: #9ca3af;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #3b82f6;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
}

.dropdown-content {
  min-width: 200px;
}

.dropdown-divider {
  margin: 0.5rem 0;
  border: none;
  border-top: 1px solid #e5e7eb;
}

.hidden {
  display: none;
}

/* Estilos base para botones */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-primary {
  background-color: #3b82f6;
  color: white;
  border-color: #3b82f6;
}

.btn-primary:hover {
  background-color: #2563eb;
  border-color: #2563eb;
}

.btn-secondary {
  background-color: transparent;
  color: #374151;
  border-color: #d1d5db;
}

.btn-secondary:hover {
  background-color: #f3f4f6;
  border-color: #9ca3af;
}

/* Estilos adicionales */
.flex {
  display: flex;
}

.items-center {
  align-items: center;
}

.gap-4 {
  gap: 1rem;
}
</style>
